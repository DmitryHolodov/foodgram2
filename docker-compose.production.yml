volumes: 
  pg_data: 
  static: 
  media: 
 
services: 
  db:
    container_name: foodgram-postgre
    image: postgres:15
    env_file: .env 
    volumes: 
      - pg_data:/var/lib/postgresql/data 
    restart: always 
 
  backend:
    container_name: foodgram-back
    image: piranya17/foodgram_backend 
    env_file: .env 
    volumes: 
      - static:/backend_static 
      - media:/media 
    depends_on: 
      - db 
    restart: always 

  frontend:
    container_name: foodgram-front
    build: ./frontend
    volumes:
      - ./frontend/:/app/result_build/ 
    restart: always 
 
  gateway:
    container_name: foodgram-nginx
    image: nginx:1.25.4-alpine 
    env_file: .env 
    ports: 
      - 8000:80
    volumes:
      - ./frontend/build:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static:/static 
      - media:/media 
    depends_on: 
      - backend 
    restart: always 
